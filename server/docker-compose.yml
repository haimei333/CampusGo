services:
  postgres:
    image: postgres:16
    container_name: campusgo-postgres
    environment:
      POSTGRES_DB: campusgo
      POSTGRES_USER: campusgo
      POSTGRES_PASSWORD: campusgo
    ports:
      - "5433:5432"
    volumes:
      - campusgo_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: campusgo-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: campusgo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: campusgo
      MINIO_ROOT_PASSWORD: campusgo123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - campusgo_minio_data:/data

volumes:
  campusgo_pg_data:
  campusgo_minio_data:
