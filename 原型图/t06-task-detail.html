/* CampusGo Soft UI Design Token — Brand CSS */
/* Brand prefix: cg */

:root {
  /* ===== Brand Colors ===== */
  --cg-brand: #3D9B8F;
  --cg-brand-pressed: #34857B;
  --cg-brand-soft: #E6F5F2;

  /* ===== Accent ===== */
  --cg-accent: #E8A87C;
  --cg-accent-soft: #FFF1E6;

  /* ===== Semantic Colors ===== */
  --cg-danger: #E57373;
  --cg-danger-soft: #FDECEC;
  --cg-warning: #F0B429;
  --cg-success: #5BAE7A;
  --cg-emergency: #E8896B;

  /* ===== Neutral / Surface ===== */
  --cg-bg-app: #F3F5F8;
  --cg-bg-card: #FFFFFF;
  --cg-bg-input: #F0F2F5;
  --cg-text-primary: #2C3340;
  --cg-text-secondary: #6B7380;
  --cg-text-tertiary: #9AA3B2;
  --cg-text-on-brand: #FFFFFF;
  --cg-divider: #E8ECF1;
  --cg-overlay: rgba(44, 51, 64, 0.4);

  /* ===== Tag / Semantic Label Colors ===== */
  --cg-tag-normal-bg: #EEF1F5;
  --cg-tag-normal-text: #5A6575;
  --cg-tag-group-bg: #E6F5F2;
  --cg-tag-group-text: #2F7A70;
  --cg-tag-emergency-bg: #FFF0EA;
  --cg-tag-emergency-text: #C45C3E;
  --cg-tag-reserve-bg: #EAF0FB;
  --cg-tag-reserve-text: #4A6FA5;
  --cg-tag-draft-bg: #F5F5F5;
  --cg-tag-draft-text: #8A9099;

  /* ===== Radius ===== */
  --cg-radius-sm: 12px;
  --cg-radius-md: 16px;
  --cg-radius-lg: 24px;
  --cg-radius-full: 9999px;

  /* ===== Shadows (Soft) ===== */
  --cg-shadow-1: 0 1px 3px rgba(0, 0, 0, 0.04);
  --cg-shadow-2: 0 2px 8px rgba(0, 0, 0, 0.05);
  --cg-shadow-3: 0 4px 16px rgba(0, 0, 0, 0.06);
  --cg-shadow-fab: 0 4px 12px rgba(61, 155, 143, 0.25);

  /* ===== Semantic Aliases (required by apply-html-head-contract) ===== */
  --cg-background: #F3F5F8;
  --cg-foreground: #2C3340;
  --cg-card: #FFFFFF;
  --cg-card-foreground: #2C3340;
  --cg-popover: #FFFFFF;
  --cg-popover-foreground: #2C3340;
  --cg-primary: #3D9B8F;
  --cg-primary-foreground: #FFFFFF;
  --cg-muted: #F0F2F5;
  --cg-muted-foreground: #6B7380;
  --cg-border: #E8ECF1;
  --cg-input: #F0F2F5;
  --cg-ring: rgba(61, 155, 143, 0.45);

  /* ===== Typography ===== */
  --cg-font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --cg-font-hero: 28px;
  --cg-font-h1: 22px;
  --cg-font-h2: 18px;
  --cg-font-h3: 16px;
  --cg-font-body: 14px;
  --cg-font-caption: 12px;
  --cg-font-amount: 20px;

  --cg-font-weight-semibold: 600;
  --cg-font-weight-medium: 500;
  --cg-font-weight-regular: 400;

  --cg-line-height-tight: 1.25;
  --cg-line-height-normal: 1.5;
  --cg-line-height-relaxed: 1.75;
}

/* ===== Base Styles ===== */
body {
  font-family: var(--cg-font-family);
  font-size: var(--cg-font-body);
  font-weight: var(--cg-font-weight-regular);
  color: var(--cg-text-primary);
  background-color: var(--cg-bg-app);
  line-height: var(--cg-line-height-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ===== Typography Classes ===== */
.cg-hero {
  font-size: var(--cg-font-hero);
  font-weight: var(--cg-font-weight-semibold);
  line-height: var(--cg-line-height-tight);
}

.cg-h1 {
  font-size: var(--cg-font-h1);
  font-weight: var(--cg-font-weight-semibold);
  line-height: var(--cg-line-height-tight);
}

.cg-h2 {
  font-size: var(--cg-font-h2);
  font-weight: var(--cg-font-weight-semibold);
  line-height: var(--cg-line-height-tight);
}

.cg-h3 {
  font-size: var(--cg-font-h3);
  font-weight: var(--cg-font-weight-semibold);
  line-height: var(--cg-line-height-tight);
}

.cg-body {
  font-size: var(--cg-font-body);
  font-weight: var(--cg-font-weight-regular);
  line-height: var(--cg-line-height-normal);
}

.cg-caption {
  font-size: var(--cg-font-caption);
  font-weight: var(--cg-font-weight-regular);
  line-height: var(--cg-line-height-normal);
  color: var(--cg-text-secondary);
}

.cg-amount {
  font-size: var(--cg-font-amount);
  font-weight: var(--cg-font-weight-semibold);
  line-height: var(--cg-line-height-tight);
}

.cg-text-secondary {
  color: var(--cg-text-secondary);
}

.cg-text-tertiary {
  color: var(--cg-text-tertiary);
}

/* ===== Component Base Classes ===== */
.cg-btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 48px;
  padding: 0 24px;
  border-radius: var(--cg-radius-md);
  background: var(--cg-brand);
  color: var(--cg-text-on-brand);
  font-size: var(--cg-font-body);
  font-weight: var(--cg-font-weight-medium);
  border: none;
  cursor: pointer;
  transition: all 200ms ease;
  box-shadow: var(--cg-shadow-2);
}

.cg-btn-primary:active {
  transform: scale(0.97);
  background: var(--cg-brand-pressed);
}

.cg-btn-primary:disabled {
  background: #B7D9D3;
  box-shadow: none;
  transform: none;
}

.cg-btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 48px;
  padding: 0 24px;
  border-radius: var(--cg-radius-md);
  background: var(--cg-bg-card);
  color: var(--cg-brand);
  font-size: var(--cg-font-body);
  font-weight: var(--cg-font-weight-medium);
  border: none;
  cursor: pointer;
  transition: all 200ms ease;
  box-shadow: var(--cg-shadow-1);
}

.cg-btn-secondary:active {
  transform: scale(0.97);
}

.cg-btn-danger-text {
  background: none;
  border: none;
  color: var(--cg-danger);
  font-size: var(--cg-font-body);
  font-weight: var(--cg-font-weight-medium);
  cursor: pointer;
  padding: 12px 0;
}

.cg-card {
  background: var(--cg-bg-card);
  border-radius: var(--cg-radius-lg);
  padding: 16px;
  box-shadow: var(--cg-shadow-1);
}

.cg-input {
  height: 50px;
  padding: 0 20px;
  background: var(--cg-bg-input);
  border-radius: var(--cg-radius-md);
  border: none;
  font-size: var(--cg-font-body);
  font-family: var(--cg-font-family);
  color: var(--cg-text-primary);
  outline: none;
  transition: all 200ms ease;
  width: 100%;
  box-sizing: border-box;
}

.cg-input:focus {
  background: var(--cg-bg-card);
  box-shadow: 0 0 0 2px var(--cg-ring);
}

.cg-input::placeholder {
  color: var(--cg-text-tertiary);
}

.cg-tag {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: var(--cg-radius-sm);
  font-size: 11px;
  font-weight: var(--cg-font-weight-medium);
  line-height: 1.4;
}

.cg-tag-normal {
  background: var(--cg-tag-normal-bg);
  color: var(--cg-tag-normal-text);
}

.cg-tag-group {
  background: var(--cg-tag-group-bg);
  color: var(--cg-tag-group-text);
}

.cg-tag-emergency {
  background: var(--cg-tag-emergency-bg);
  color: var(--cg-tag-emergency-text);
}

.cg-tag-reserve {
  background: var(--cg-tag-reserve-bg);
  color: var(--cg-tag-reserve-text);
}

.cg-tag-draft {
  background: var(--cg-tag-draft-bg);
  color: var(--cg-tag-draft-text);
}

/* ===== Bottom Navigation ===== */
.cg-bottom-nav {
  background: var(--cg-bg-card);
  height: 56px;
  box-shadow: 0 -1px 4px rgba(0, 0, 0, 0.03);
  display: flex;
  align-items: center;
}

.cg-bottom-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  flex: 1;
  height: 100%;
  color: var(--cg-text-tertiary);
  font-size: 11px;
  font-weight: var(--cg-font-weight-regular);
  text-decoration: none;
  cursor: pointer;
  transition: color 200ms ease;
  min-width: 0;
}

.cg-bottom-nav-item svg {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
}

.cg-bottom-nav-item.active {
  color: var(--cg-brand);
}

.cg-bottom-nav-item.active .nav-icon-bg {
  background: var(--cg-brand-soft);
  border-radius: var(--cg-radius-md);
  padding: 4px;
}

/* ===== FAB ===== */
.cg-fab {
  position: fixed;
  bottom: 80px;
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: var(--cg-radius-full);
  background: var(--cg-brand);
  color: var(--cg-text-on-brand);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--cg-shadow-fab);
  border: none;
  cursor: pointer;
  transition: all 200ms ease;
  z-index: 50;
  font-size: 24px;
  font-weight: var(--cg-font-weight-regular);
}

.cg-fab:active {
  transform: scale(0.95);
}

/* ===== Top Bar ===== */
.cg-topbar {
  display: flex;
  align-items: center;
  height: 48px;
  padding: 0 16px;
  background: var(--cg-bg-card);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
  position: sticky;
  top: 0;
  z-index: 40;
}

.cg-topbar-title {
  font-size: var(--cg-font-h3);
  font-weight: var(--cg-font-weight-semibold);
  color: var(--cg-text-primary);
  flex: 1;
  text-align: center;
}

.cg-topbar-back {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--cg-text-primary);
  background: none;
  border: none;
  flex-shrink: 0;
}

.cg-topbar-action {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--cg-brand);
  font-size: var(--cg-font-body);
  font-weight: var(--cg-font-weight-medium);
  background: none;
  border: none;
  flex-shrink: 0;
}

/* ===== Status Banner ===== */
.cg-status-banner {
  padding: 10px 16px;
  border-radius: var(--cg-radius-md);
  font-size: var(--cg-font-caption);
  font-weight: var(--cg-font-weight-medium);
}

.cg-status-pending { background: #FFF8E7; color: #B8860B; }
.cg-status-accepted { background: var(--cg-brand-soft); color: var(--cg-brand); }
.cg-status-delivering { background: #E8F4FD; color: #2E7DB5; }
.cg-status-confirming { background: #FFF1E6; color: #C4763E; }
.cg-status-done { background: #E8F5EC; color: #3D7A52; }
.cg-status-cancelled { background: #F5F5F5; color: #8A9099; }

/* ===== Utility ===== */
.cg-divider {
  height: 1px;
  background: var(--cg-divider);
  border: none;
  margin: 0;
}

.cg-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

            <div>
              <span class="text-xs text-[var(--cg-text-tertiary)] block">取件地址</span>
              <span class="text-sm text-[var(--cg-text-primary)]">北京大学 南门快递站</span>
            </div>
          </div>
          <div class="flex items-start gap-2.5">
            <i data-lucide="map-pin" class="w-5 h-5 text-[var(--cg-accent)] mt-0.5 shrink-0"></i>
            <div>
              <span class="text-xs text-[var(--cg-text-tertiary)] block">送达地址</span>
              <span class="text-sm text-[var(--cg-text-primary)]">北京大学 38号楼</span>
            </div>
          </div>
        </div>
        <div class="h-px bg-[var(--cg-divider)]"></div>
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-xs text-[var(--cg-text-tertiary)]">跑腿费</span>
            <span id="reward-amount" class="text-xl font-semibold text-[var(--cg-brand)]">¥15.00</span>
          </div>
          <div class="flex items-center gap-1.5 text-[var(--cg-text-secondary)]">
            <i data-lucide="clock" class="w-4 h-4"></i>
            <span class="text-sm">尽快送达</span>
          </div>
        </div>
      </div>

      <div id="runner-card" class="hidden bg-white rounded-2xl p-3 shadow-[var(--cg-shadow-1)] flex items-center gap-3">
        <div class="w-12 h-12 rounded-full bg-[var(--cg-bg-input)] flex items-center justify-center shrink-0">
          <i data-lucide="user" class="w-6 h-6 text-[var(--cg-text-tertiary)]"></i>
        </div>
        <div class="flex flex-col gap-1 flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <span class="text-sm font-semibold text-[var(--cg-text-primary)]">张同学</span>
            <span class="text-xs text-[var(--cg-accent)] flex items-center gap-0.5">
              <i data-lucide="star" class="w-3 h-3 fill-[var(--cg-accent)]"></i>
              <span class="font-medium">4.8</span>
            </span>
          </div>
          <span class="text-xs text-[var(--cg-text-tertiary)]">已完成 32 单 · 信用分 720</span>
        </div>
        <button type="button" onclick="location.href='c01-chat.html'" class="flex items-center gap-1.5 h-8 px-3 rounded-2xl border border-[var(--cg-brand)] text-[var(--cg-brand)] bg-white text-xs font-medium cursor-pointer shrink-0">
          <i data-lucide="message-circle" class="w-3.5 h-3.5"></i>
          <span>联系ta</span>
        </button>
      </div>

      <div id="photo-card" class="hidden bg-white rounded-2xl p-3 shadow-[var(--cg-shadow-1)]">
        <h3 class="text-sm font-semibold text-[var(--cg-text-primary)] mb-2">送达照片</h3>
        <div class="w-full h-36 rounded-xl bg-[var(--cg-bg-input)] flex items-center justify-center text-[var(--cg-text-tertiary)] text-sm">
          <div class="flex flex-col items-center gap-2">
            <i data-lucide="image" class="w-8 h-8"></i>
            <span>快递已放门口（示意）</span>
          </div>
        </div>
      </div>

      <div id="timeline" class="bg-white rounded-2xl p-3 shadow-[var(--cg-shadow-1)]">
        <h3 class="text-sm font-semibold text-[var(--cg-text-primary)] mb-3">配送进度</h3>
        <div id="timeline-steps" class="flex flex-col gap-0"></div>
      </div>

      <div id="hint" class="text-xs text-[var(--cg-text-tertiary)] px-1 pb-2"></div>
    </main>

    <div id="bottom-bar" class="fixed bottom-0 left-0 right-0 bg-white shadow-[0_-2px_12px_rgba(0,0,0,0.06)] px-4 py-3 flex items-center gap-2 z-50 flex-wrap"></div>

    <!-- 加价半屏 -->
    <div id="raise-sheet" class="hidden fixed inset-0 z-[60]">
      <div class="absolute inset-0 bg-[var(--cg-overlay)]" onclick="closeRaise()"></div>
      <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl p-5 shadow-lg">
        <h3 class="text-base font-semibold mb-1">加价催单</h3>
        <p class="text-xs text-[var(--cg-text-secondary)] mb-4">差额从钱包托管扣除；余额不足将跳转充值</p>
        <div class="flex gap-2 mb-4">
          <button type="button" class="raise-chip flex-1 h-10 rounded-xl border border-[var(--cg-divider)] text-sm cursor-pointer bg-[var(--cg-brand-soft)] border-[var(--cg-brand)] text-[var(--cg-brand)]" data-amt="3">+¥3</button>
          <button type="button" class="raise-chip flex-1 h-10 rounded-xl border border-[var(--cg-divider)] text-sm cursor-pointer bg-white" data-amt="5">+¥5</button>
          <button type="button" class="raise-chip flex-1 h-10 rounded-xl border border-[var(--cg-divider)] text-sm cursor-pointer bg-white" data-amt="10">+¥10</button>
        </div>
        <button type="button" onclick="confirmRaise()" class="w-full h-11 rounded-2xl bg-[var(--cg-brand)] text-white text-sm font-semibold border-0 cursor-pointer">确认加价</button>
      </div>
    </div>

    <script>
      let role = 'publisher';
      let status = 'pending';
      let reward = 15;
      let isEmergency = false;
      let raiseAmt = 3;

      const STATUS_META = {
        pending: { title: '待接单', descPub: '等待附近跑腿员接单；可加价或转紧急', descRun: '可抢单承接此任务', icon: 'clock', step: 0 },
        accepted: { title: '已接单', descPub: '跑腿员已接单，等待开始配送', descRun: '请尽快开始配送', icon: 'check-circle', step: 1 },
        delivering: { title: '配送中', descPub: '跑腿员配送中，可查看实时位置', descRun: '到达后请拍照确认送达', icon: 'navigation', step: 2 },
        confirm: { title: '待确认', descPub: '请核对送达照片后确认完成', descRun: '等待发布者确认（24h 未操作将自动完成）', icon: 'camera', step: 3 }
      };

      const TIMELINE = ['任务发布', '跑腿员接单', '开始配送', '确认完成'];

      function setDemoActive() {
        document.querySelectorAll('.demo-role').forEach(btn => {
          const on = btn.dataset.role === role;
          btn.className = 'demo-role px-3 py-1.5 rounded-full text-[12px] font-medium border-0 cursor-pointer ' + (on
            ? 'bg-[var(--cg-brand)] text-white'
            : 'bg-[var(--cg-bg-input)] text-[var(--cg-text-secondary)]');
        });
        document.querySelectorAll('.demo-status').forEach(btn => {
          const on = btn.dataset.status === status;
          btn.className = 'demo-status px-3 py-1.5 rounded-full text-[12px] font-medium border-0 cursor-pointer ' + (on
            ? 'bg-[var(--cg-brand)] text-white'
            : 'bg-[var(--cg-bg-input)] text-[var(--cg-text-secondary)]');
        });
      }

      function renderTimeline() {
        const cur = STATUS_META[status].step;
        const el = document.getElementById('timeline-steps');
        el.innerHTML = TIMELINE.map((label, i) => {
          const done = i < cur;
          const current = i === cur;
          const color = done || current ? 'var(--cg-brand)' : 'var(--cg-divider)';
          const text = current ? 'text-[var(--cg-brand)] font-semibold' : done ? 'text-[var(--cg-text-primary)] font-medium' : 'text-[var(--cg-text-tertiary)]';
          const line = i < TIMELINE.length - 1
            ? `<div class="w-px flex-1 mt-1" style="background:${i < cur ? 'var(--cg-brand)' : 'var(--cg-divider)'}"></div>` : '';
          const ping = current ? '<div class="absolute inset-0 rounded-full bg-[var(--cg-brand)] animate-ping opacity-40"></div>' : '';
          const size = current ? 'w-3 h-3 mt-1 relative' : 'w-2.5 h-2.5 mt-1.5';
          const sub = current && status === 'delivering' ? '<span class="text-xs text-[var(--cg-text-tertiary)]">进行中...</span>'
            : done && i === 0 ? '<span class="text-xs text-[var(--cg-text-tertiary)]">2024-07-25 14:30</span>'
            : done && i === 1 ? '<span class="text-xs text-[var(--cg-text-tertiary)]">2024-07-25 14:35</span>'
            : done && i === 2 ? '<span class="text-xs text-[var(--cg-text-tertiary)]">2024-07-25 14:40</span>'
            : done && i === 3 ? '<span class="text-xs text-[var(--cg-text-tertiary)]">待发布者确认</span>' : '';
          return `<div class="flex items-stretch gap-3" style="min-height:40px">
            <div class="flex flex-col items-center w-5 shrink-0">
              <div class="${size} rounded-full shrink-0" style="background:${color}">${ping}</div>${line}
            </div>
            <div class="flex flex-col justify-center pb-3"><span class="text-sm ${text}">${label}</span>${sub}</div>
          </div>`;
        }).join('');
      }

      function btn(label, opts) {
        const { primary, outline, danger, href, onclick, icon } = opts || {};
        const base = 'flex items-center justify-center gap-1.5 h-11 px-3 rounded-2xl text-sm font-medium border cursor-pointer transition-all active:scale-95';
        let cls = base + ' bg-white text-[var(--cg-text-primary)] border-[var(--cg-divider)]';
        if (primary) cls = base + ' bg-[var(--cg-brand)] text-white border-none shadow-[var(--cg-shadow-2)]';
        if (outline) cls = base + ' bg-white text-[var(--cg-brand)] border-[var(--cg-brand)]';
        if (danger) cls = 'text-[var(--cg-danger)] bg-transparent border-none text-sm font-medium cursor-pointer py-2 px-1 shrink-0';
        const attrs = href ? `onclick="location.href='${href}'"` : (onclick ? `onclick="${onclick}"` : '');
        const ic = icon ? `<i data-lucide="${icon}" class="w-4 h-4"></i>` : '';
        return `<button type="button" class="${cls}" ${attrs}>${ic}${label}</button>`;
      }

      function renderBar() {
        const bar = document.getElementById('bottom-bar');
        let html = '';
        if (role === 'publisher' && status === 'pending') {
          html = btn('取消', { danger: true, href: 't11-cancel.html' })
            + '<div class="flex-1"></div>'
            + btn('加价', { outline: true, onclick: 'openRaise()' })
            + btn('转紧急', { primary: true, onclick: 'toEmergency()' });
        } else if (role === 'runner' && status === 'pending') {
          html = '<div class="flex-1"></div>' + btn('抢单', { primary: true, onclick: 'grabOrder()' });
        } else if (role === 'publisher' && status === 'accepted') {
          html = btn('取消', { danger: true, href: 't11-cancel.html' })
            + '<div class="flex-1"></div>'
            + btn('联系跑腿员', { outline: true, href: 'c01-chat.html', icon: 'message-circle' });
        } else if (role === 'runner' && status === 'accepted') {
          html = btn('取消', { danger: true, href: 't11-cancel.html' })
            + '<div class="flex-1"></div>'
            + btn('联系发布者', { outline: true, href: 'c01-chat.html', icon: 'message-circle' })
            + btn('开始配送', { primary: true, onclick: "setStatus('delivering')" });
        } else if (role === 'publisher' && status === 'delivering') {
          // 配送中不可取消 — 仅投诉/聊天/追踪
          html = btn('投诉', { danger: true, href: 's02-complaint.html' })
            + '<div class="flex-1"></div>'
            + btn('联系', { outline: true, href: 'c01-chat.html', icon: 'message-circle' })
            + btn('查看配送位置', { primary: true, href: 'l01-tracking.html', icon: 'map-pin' });
        } else if (role === 'runner' && status === 'delivering') {
          html = '<div class="flex-1"></div>'
            + btn('联系发布者', { outline: true, href: 'c01-chat.html', icon: 'message-circle' })
            + btn('我已送达', { primary: true, href: 't08-photo.html', icon: 'camera' });
        } else if (role === 'publisher' && status === 'confirm') {
          html = btn('有异议', { danger: true, href: 's02-complaint.html' })
            + '<div class="flex-1"></div>'
            + btn('确认完成', { primary: true, href: 't10-review.html' });
        } else if (role === 'runner' && status === 'confirm') {
          html = '<div class="flex-1 text-center text-sm text-[var(--cg-text-secondary)] py-2">等待发布者确认… 5 分钟内可<a href="t08-photo.html" class="text-[var(--cg-brand)]">补拍</a></div>';
        }
        bar.innerHTML = html;
        lucide.createIcons();
      }

      function render() {
        const meta = STATUS_META[status];
        document.getElementById('banner-title').textContent = meta.title + (isEmergency && status === 'pending' ? ' · 紧急' : '');
        document.getElementById('banner-desc').textContent = role === 'publisher' ? meta.descPub : meta.descRun;
        document.getElementById('reward-amount').textContent = '¥' + reward.toFixed(2);
        document.getElementById('mode-tag').classList.toggle('hidden', !isEmergency);
        document.getElementById('runner-card').classList.toggle('hidden', status === 'pending');
        document.getElementById('runner-card').classList.toggle('flex', status !== 'pending');
        document.getElementById('photo-card').classList.toggle('hidden', status !== 'confirm');
        document.getElementById('share-btn').style.visibility = (role === 'publisher' && status === 'pending') ? 'visible' : 'hidden';
        const hints = {
          'publisher|pending': '规范：待接单可加价 / 转紧急 / 取消；分享可用。',
          'runner|pending': '规范：抢单前校验校园卡认证与信用分≥400。',
          'publisher|accepted': '规范：可聊天、规则内取消。',
          'runner|accepted': '规范：开始配送后进入配送中。',
          'publisher|delivering': '规范：配送中不可取消，可追踪、聊天、投诉。',
          'runner|delivering': '规范：我已送达 → T08 拍照 → 回待确认。',
          'publisher|confirm': '规范：页内看图；确认完成或有异议→S02。',
          'runner|confirm': '规范：等待确认；5 分钟内可补拍。'
        };
        document.getElementById('hint').textContent = hints[role + '|' + status] || '';
        setDemoActive();
        renderTimeline();
        renderBar();
        lucide.createIcons();
      }

      function setStatus(s) { status = s; render(); }
      function grabOrder() { status = 'accepted'; render(); }
      function toEmergency() {
        if (isEmergency) { alert('已是紧急任务'); return; }
        if (!confirm('转紧急将加价 50%（¥' + reward + ' → ¥' + (reward * 1.5).toFixed(2) + '），确认？')) return;
        reward = Math.round(reward * 1.5 * 100) / 100;
        isEmergency = true;
        render();
      }
      function openRaise() { document.getElementById('raise-sheet').classList.remove('hidden'); }
      function closeRaise() { document.getElementById('raise-sheet').classList.add('hidden'); }
      function confirmRaise() {
        reward = Math.round((reward + raiseAmt) * 100) / 100;
        closeRaise();
        render();
      }

      document.querySelectorAll('.demo-role').forEach(btn => btn.addEventListener('click', () => { role = btn.dataset.role; render(); }));
      document.querySelectorAll('.demo-status').forEach(btn => btn.addEventListener('click', () => { status = btn.dataset.status; render(); }));
      document.querySelectorAll('.raise-chip').forEach(btn => btn.addEventListener('click', () => {
        raiseAmt = Number(btn.dataset.amt);
        document.querySelectorAll('.raise-chip').forEach(c => {
          c.classList.remove('bg-[var(--cg-brand-soft)]', 'border-[var(--cg-brand)]', 'text-[var(--cg-brand)]');
          c.classList.add('bg-white');
        });
        btn.classList.add('bg-[var(--cg-brand-soft)]', 'border-[var(--cg-brand)]', 'text-[var(--cg-brand)]');
        btn.classList.remove('bg-white');
      }));

      const params = new URLSearchParams(location.search);
      if (params.get('role')) role = params.get('role');
      if (params.get('status')) status = params.get('status');
      render();
    </script>
</body>
</html>
