    <style id="theme-vars">
/* CampusGo Soft UI Design Token — Brand CSS */
/* Brand prefix: cg */

:root {
  /* ===== Brand Colors ===== */
  --cg-brand: #3D9B8F;
  --cg-brand-pressed: #34857B;
  --cg-brand-soft: #E6F5F2;

  /* ===== Accent ===== */
  --cg-accent: #E8A87C;
  --cg-accent-soft: #FFF1E6;

  /* ===== Semantic Colors ===== */
  --cg-danger: #E57373;
  --cg-danger-soft: #FDECEC;
  --cg-warning: #F0B429;
  --cg-success: #5BAE7A;
  --cg-emergency: #E8896B;

  /* ===== Neutral / Surface ===== */
  --cg-bg-app: #F3F5F8;
  --cg-bg-card: #FFFFFF;
  --cg-bg-input: #F0F2F5;
  --cg-text-primary: #2C3340;
  --cg-text-secondary: #6B7380;
  --cg-text-tertiary: #9AA3B2;
  --cg-text-on-brand: #FFFFFF;
  --cg-divider: #E8ECF1;
  --cg-overlay: rgba(44, 51, 64, 0.4);

  /* ===== Tag / Semantic Label Colors ===== */
  --cg-tag-normal-bg: #EEF1F5;
  --cg-tag-normal-text: #5A6575;
  --cg-tag-group-bg: #E6F5F2;
  --cg-tag-group-text: #2F7A70;
  --cg-tag-emergency-bg: #FFF0EA;
  --cg-tag-emergency-text: #C45C3E;
  --cg-tag-reserve-bg: #EAF0FB;
  --cg-tag-reserve-text: #4A6FA5;
  --cg-tag-draft-bg: #F5F5F5;
  --cg-tag-draft-text: #8A9099;

  /* ===== Radius ===== */
  --cg-radius-sm: 12px;
  --cg-radius-md: 16px;
  --cg-radius-lg: 24px;
  --cg-radius-full: 9999px;

  /* ===== Shadows (Soft) ===== */
  --cg-shadow-1: 0 1px 3px rgba(0, 0, 0, 0.04);
  --cg-shadow-2: 0 2px 8px rgba(0, 0, 0, 0.05);
  --cg-shadow-3: 0 4px 16px rgba(0, 0, 0, 0.06);
  --cg-shadow-fab: 0 4px 12px rgba(61, 155, 143, 0.25);

  /* ===== Semantic Aliases (required by apply-html-head-contract) ===== */
  --cg-background: #F3F5F8;
  --cg-foreground: #2C3340;
  --cg-card: #FFFFFF;
  --cg-card-foreground: #2C3340;
  --cg-popover: #FFFFFF;
  --cg-popover-foreground: #2C3340;
  --cg-primary: #3D9B8F;
  --cg-primary-foreground: #FFFFFF;
  --cg-muted: #F0F2F5;
  --cg-muted-foreground: #6B7380;
  --cg-border: #E8ECF1;
  --cg-input: #F0F2F5;
  --cg-ring: rgba(61, 155, 143, 0.45);

  /* ===== Typography ===== */
  --cg-font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --cg-font-hero: 28px;
  --cg-font-h1: 22px;
  --cg-font-h2: 18px;
  --cg-font-h3: 16px;
  --cg-font-body: 14px;
  --cg-font-caption: 12px;
  --cg-font-amount: 20px;

  --cg-font-weight-semibold: 600;
  --cg-font-weight-medium: 500;
  --cg-font-weight-regular: 400;

  --cg-line-height-tight: 1.25;
  --cg-line-height-normal: 1.5;
  --cg-line-height-relaxed: 1.75;
}

/* ===== Base Styles ===== */
body {
  font-family: var(--cg-font-family);
  font-size: var(--cg-font-body);
  font-weight: var(--cg-font-weight-regular);
  color: var(--cg-text-primary);
  background-color: var(--cg-bg-app);
  line-height: var(--cg-line-height-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ===== Typography Classes ===== */
.cg-hero {
  font-size: var(--cg-font-hero);
  font-weight: var(--cg-font-weight-semibold);
  line-height: var(--cg-line-height-tight);
}

.cg-h1 {
  font-size: var(--cg-font-h1);
  font-weight: var(--cg-font-weight-semibold);
  line-height: var(--cg-line-height-tight);
}

.cg-h2 {
  font-size: var(--cg-font-h2);
  font-weight: var(--cg-font-weight-semibold);
  line-height: var(--cg-line-height-tight);
}

.cg-h3 {
  font-size: var(--cg-font-h3);
  font-weight: var(--cg-font-weight-semibold);
  line-height: var(--cg-line-height-tight);
}

.cg-body {
  font-size: var(--cg-font-body);
  font-weight: var(--cg-font-weight-regular);
  line-height: var(--cg-line-height-normal);
}

.cg-caption {
  font-size: var(--cg-font-caption);
  font-weight: var(--cg-font-weight-regular);
  line-height: var(--cg-line-height-normal);
  color: var(--cg-text-secondary);
}

.cg-amount {
  font-size: var(--cg-font-amount);
  font-weight: var(--cg-font-weight-semibold);
  line-height: var(--cg-line-height-tight);
}

.cg-text-secondary {
  color: var(--cg-text-secondary);
}

.cg-text-tertiary {
  color: var(--cg-text-tertiary);
}

/* ===== Component Base Classes ===== */
.cg-btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 48px;
  padding: 0 24px;
  border-radius: var(--cg-radius-md);
  background: var(--cg-brand);
  color: var(--cg-text-on-brand);
  font-size: var(--cg-font-body);
  font-weight: var(--cg-font-weight-medium);
  border: none;
  cursor: pointer;
  transition: all 200ms ease;
  box-shadow: var(--cg-shadow-2);
}

.cg-btn-primary:active {
  transform: scale(0.97);
  background: var(--cg-brand-pressed);
}

.cg-btn-primary:disabled {
  background: #B7D9D3;
  box-shadow: none;
  transform: none;
}

.cg-btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 48px;
  padding: 0 24px;
  border-radius: var(--cg-radius-md);
  background: var(--cg-bg-card);
  color: var(--cg-brand);
  font-size: var(--cg-font-body);
  font-weight: var(--cg-font-weight-medium);
  border: none;
  cursor: pointer;
  transition: all 200ms ease;
  box-shadow: var(--cg-shadow-1);
}

.cg-btn-secondary:active {
  transform: scale(0.97);
}

.cg-btn-danger-text {
  background: none;
  border: none;
  color: var(--cg-danger);
  font-size: var(--cg-font-body);
  font-weight: var(--cg-font-weight-medium);
  cursor: pointer;
  padding: 12px 0;
}

.cg-card {
  background: var(--cg-bg-card);
  border-radius: var(--cg-radius-lg);
  padding: 16px;
  box-shadow: var(--cg-shadow-1);
}

.cg-input {
  height: 50px;
  padding: 0 20px;
  background: var(--cg-bg-input);
  border-radius: var(--cg-radius-md);
  border: none;
  font-size: var(--cg-font-body);
  font-family: var(--cg-font-family);
  color: var(--cg-text-primary);
  outline: none;
  transition: all 200ms ease;
  width: 100%;
  box-sizing: border-box;
}

.cg-input:focus {
  background: var(--cg-bg-card);
  box-shadow: 0 0 0 2px var(--cg-ring);
}

.cg-input::placeholder {
  color: var(--cg-text-tertiary);
}

.cg-tag {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: var(--cg-radius-sm);
  font-size: 11px;
  font-weight: var(--cg-font-weight-medium);
  line-height: 1.4;
}

.cg-tag-normal {
  background: var(--cg-tag-normal-bg);
  color: var(--cg-tag-normal-text);
}

.cg-tag-group {
  background: var(--cg-tag-group-bg);
  color: var(--cg-tag-group-text);
}

.cg-tag-emergency {
  background: var(--cg-tag-emergency-bg);
  color: var(--cg-tag-emergency-text);
}

.cg-tag-reserve {
  background: var(--cg-tag-reserve-bg);
  color: var(--cg-tag-reserve-text);
}

.cg-tag-draft {
  background: var(--cg-tag-draft-bg);
  color: var(--cg-tag-draft-text);
}

/* ===== Bottom Navigation ===== */
.cg-bottom-nav {
  background: var(--cg-bg-card);
  height: 56px;
  box-shadow: 0 -1px 4px rgba(0, 0, 0, 0.03);
  display: flex;
  align-items: center;
}

.cg-bottom-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  flex: 1;
  height: 100%;
  color: var(--cg-text-tertiary);
  font-size: 11px;
  font-weight: var(--cg-font-weight-regular);
  text-decoration: none;
  cursor: pointer;
  transition: color 200ms ease;
  min-width: 0;
}

.cg-bottom-nav-item svg {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
}

.cg-bottom-nav-item.active {
  color: var(--cg-brand);
}

.cg-bottom-nav-item.active .nav-icon-bg {
  background: var(--cg-brand-soft);
  border-radius: var(--cg-radius-md);
  padding: 4px;
}

/* ===== FAB ===== */
.cg-fab {
  position: fixed;
  bottom: 80px;
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: var(--cg-radius-full);
  background: var(--cg-brand);
  color: var(--cg-text-on-brand);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--cg-shadow-fab);
  border: none;
  cursor: pointer;
  transition: all 200ms ease;
  z-index: 50;
  font-size: 24px;
  font-weight: var(--cg-font-weight-regular);
}

.cg-fab:active {
  transform: scale(0.95);
}

/* ===== Top Bar ===== */
.cg-topbar {
  display: flex;
  align-items: center;
  height: 48px;
  padding: 0 16px;
  background: var(--cg-bg-card);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
  position: sticky;
  top: 0;
  z-index: 40;
}

.cg-topbar-title {
  font-size: var(--cg-font-h3);
  font-weight: var(--cg-font-weight-semibold);
  color: var(--cg-text-primary);
  flex: 1;
  text-align: center;
}

.cg-topbar-back {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--cg-text-primary);
  background: none;
  border: none;
  flex-shrink: 0;
}

.cg-topbar-action {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--cg-brand);
  font-size: var(--cg-font-body);
  font-weight: var(--cg-font-weight-medium);
  background: none;
  border: none;
  flex-shrink: 0;
}

/* ===== Status Banner ===== */
.cg-status-banner {
  padding: 10px 16px;
  border-radius: var(--cg-radius-md);
  font-size: var(--cg-font-caption);
  font-weight: var(--cg-font-weight-medium);
}

.cg-status-pending { background: #FFF8E7; color: #B8860B; }
.cg-status-accepted { background: var(--cg-brand-soft); color: var(--cg-brand); }
.cg-status-delivering { background: #E8F4FD; color: #2E7DB5; }
.cg-status-confirming { background: #FFF1E6; color: #C4763E; }
.cg-status-done { background: #E8F5EC; color: #3D7A52; }
.cg-status-cancelled { background: #F5F5F5; color: #8A9099; }

/* ===== Utility ===== */
.cg-divider {
  height: 1px;
  background: var(--cg-divider);
  border: none;
  margin: 0;
}

.cg-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

<body class="min-h-screen font-sans antialiased">
    <main class="pb-28">
      <div class="cg-topbar">
        <button type="button" class="cg-topbar-back" onclick="history.back()">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </button>
        <span class="cg-topbar-title">发布任务</span>
        <button type="button" class="cg-topbar-action" onclick="alert('已暂存草稿，可在「我的发布 · 草稿」继续编辑')">存草稿</button>
      </div>

      <div class="px-4 pt-4 space-y-3">
        <!-- 任务模式：普通 / 拼单 / 紧急 / 预约 -->
        <div class="bg-card rounded-[16px] p-4 shadow-[0_1px_3px_rgba(0,0,0,0.04)]">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
              <i data-lucide="layers" class="w-4 h-4 text-primary"></i>
              <span class="text-sm font-medium text-foreground">任务模式</span>
            </div>
            <button type="button" class="text-xs text-primary" onclick="location.href='t03-templates.html'">使用模板</button>
          </div>
          <div class="grid grid-cols-4 gap-2" id="mode-chips">
            <button type="button" data-mode="normal" class="mode-chip py-2.5 rounded-xl text-xs font-semibold bg-primary text-primary-foreground border-0 cursor-pointer">普通</button>
            <button type="button" data-mode="group" class="mode-chip py-2.5 rounded-xl text-xs font-medium bg-[#F0F2F5] text-muted-foreground border-0 cursor-pointer">拼单</button>
            <button type="button" data-mode="emergency" class="mode-chip py-2.5 rounded-xl text-xs font-medium bg-[#F0F2F5] text-muted-foreground border-0 cursor-pointer">紧急</button>
            <button type="button" data-mode="reserve" class="mode-chip py-2.5 rounded-xl text-xs font-medium bg-[#F0F2F5] text-muted-foreground border-0 cursor-pointer">预约</button>
          </div>
          <p id="mode-hint" class="text-[11px] text-muted-foreground mt-2.5 leading-relaxed">标准跑腿：一人承担全部费用，发布后进入待接单。</p>
        </div>

        <!-- 服务分类（原误标为任务类型） -->
        <div class="bg-card rounded-[16px] p-4 shadow-[0_1px_3px_rgba(0,0,0,0.04)]">
          <div class="flex items-center gap-2 mb-3">
            <i data-lucide="tag" class="w-4 h-4 text-primary"></i>
            <span class="text-sm font-medium text-foreground">服务分类</span>
          </div>
          <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1" id="category-chips">
            <button type="button" data-cat="pickup" class="cat-chip flex items-center gap-1.5 shrink-0 px-4 py-2 rounded-full text-sm font-medium bg-primary text-primary-foreground border-0 cursor-pointer"><i data-lucide="package" class="w-4 h-4"></i>代取快递</button>
            <button type="button" data-cat="buy" class="cat-chip flex items-center gap-1.5 shrink-0 px-4 py-2 rounded-full text-sm font-medium bg-card text-muted-foreground border border-border cursor-pointer"><i data-lucide="shopping-bag" class="w-4 h-4"></i>代买物品</button>
            <button type="button" data-cat="errand" class="cat-chip flex items-center gap-1.5 shrink-0 px-4 py-2 rounded-full text-sm font-medium bg-card text-muted-foreground border border-border cursor-pointer"><i data-lucide="briefcase" class="w-4 h-4"></i>代办事务</button>
          </div>
        </div>

        <!-- 拼单专属 -->
        <div id="group-fields" class="hidden bg-card rounded-[16px] p-4 shadow-[0_1px_3px_rgba(0,0,0,0.04)] space-y-3">
          <div class="flex items-center gap-2">
            <i data-lucide="users" class="w-4 h-4 text-primary"></i>
            <span class="text-sm font-medium text-foreground">拼单设置</span>
          </div>
          <div>
            <label class="text-xs text-muted-foreground">目标人数（2–10）</label>
            <input id="group-size" type="number" min="2" max="10" value="3" class="mt-1 w-full h-11 px-3 rounded-xl bg-input border-0 text-sm outline-none" />
          </div>
          <div>
            <label class="text-xs text-muted-foreground block mb-2">费用分摊</label>
            <div class="flex gap-2">
              <button type="button" data-split="equal" class="split-chip flex-1 h-10 rounded-xl text-sm font-medium bg-primary text-primary-foreground border-0 cursor-pointer">均摊</button>
              <button type="button" data-split="distance" class="split-chip flex-1 h-10 rounded-xl text-sm font-medium bg-[#F0F2F5] text-muted-foreground border-0 cursor-pointer">按单摊</button>
            </div>
          </div>
        </div>

        <!-- 酬劳 -->
        <div class="bg-card rounded-[16px] p-4 shadow-[0_1px_3px_rgba(0,0,0,0.04)]">
          <div class="flex items-center gap-2 mb-3">
            <i data-lucide="coins" class="w-4 h-4 text-primary"></i>
            <span class="text-sm font-medium text-foreground">任务酬劳</span>
          </div>
          <div class="flex items-center gap-2 bg-input rounded-[16px] px-4 h-[50px] mb-2">
            <span class="text-lg font-semibold">¥</span>
            <input id="price-input" type="number" class="flex-1 bg-transparent border-none outline-none text-lg font-semibold" min="1" step="0.01" value="15.00" />
          </div>
          <p id="emergency-price" class="hidden text-xs text-[#C45C3E] mb-2">紧急模式自动加价 50%，实付托管 <strong id="pay-amount">¥22.50</strong></p>
          <div class="flex gap-2">
            <button type="button" class="price-chip shrink-0 px-3 py-1.5 rounded-full text-xs font-medium border border-primary text-primary bg-white cursor-pointer" data-p="5">¥5</button>
            <button type="button" class="price-chip shrink-0 px-3 py-1.5 rounded-full text-xs font-medium border border-primary text-primary bg-white cursor-pointer" data-p="10">¥10</button>
            <button type="button" class="price-chip shrink-0 px-3 py-1.5 rounded-full text-xs font-medium border border-primary bg-primary text-primary-foreground cursor-pointer" data-p="15">¥15</button>
            <button type="button" class="price-chip shrink-0 px-3 py-1.5 rounded-full text-xs font-medium border border-primary text-primary bg-white cursor-pointer" data-p="20">¥20</button>
          </div>
        </div>

        <!-- 地址 -->
        <div class="bg-card rounded-[16px] shadow-[0_1px_3px_rgba(0,0,0,0.04)]">
          <div class="flex items-center justify-between px-4 py-3.5 cursor-pointer" onclick="location.href='t05-map-pick.html'">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-full bg-[#E6F5F2] flex items-center justify-center shrink-0"><i data-lucide="map-pin" class="w-4 h-4 text-primary"></i></div>
              <div>
                <span class="text-sm font-medium text-foreground">取件地址</span>
                <p class="text-xs text-muted-foreground mt-0.5">地图选点或常用地址</p>
              </div>
            </div>
            <i data-lucide="chevron-right" class="w-4 h-4 text-muted-foreground"></i>
          </div>
          <hr class="cg-divider mx-4" />
          <div class="flex items-center justify-between px-4 py-3.5 cursor-pointer" onclick="location.href='t05-map-pick.html'">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-full bg-[#E6F5F2] flex items-center justify-center shrink-0"><i data-lucide="map-pin" class="w-4 h-4 text-primary"></i></div>
              <div>
                <span class="text-sm font-medium text-foreground">送达地址</span>
                <p class="text-xs text-muted-foreground mt-0.5">地图选点或常用地址</p>
              </div>
            </div>
            <i data-lucide="chevron-right" class="w-4 h-4 text-muted-foreground"></i>
          </div>
          <div class="px-4 pb-3">
            <button type="button" class="text-xs text-primary" onclick="location.href='t04-address.html'">管理常用地址</button>
          </div>
        </div>

        <!-- 时间 -->
        <div class="bg-card rounded-[16px] p-4 shadow-[0_1px_3px_rgba(0,0,0,0.04)]">
          <div class="flex items-center gap-2 mb-3">
            <i data-lucide="clock" class="w-4 h-4 text-primary"></i>
            <span class="text-sm font-medium text-foreground" id="time-label">期望时间</span>
          </div>
          <div id="time-normal" class="flex gap-2 flex-wrap">
            <button type="button" class="time-chip shrink-0 px-4 py-2 rounded-full text-sm font-medium bg-primary text-primary-foreground border-0 cursor-pointer">尽快</button>
            <button type="button" class="time-chip shrink-0 px-4 py-2 rounded-full text-sm font-medium bg-card text-muted-foreground border border-border cursor-pointer">1小时内</button>
            <button type="button" class="time-chip shrink-0 px-4 py-2 rounded-full text-sm font-medium bg-card text-muted-foreground border border-border cursor-pointer">2小时内</button>
          </div>
          <div id="time-reserve" class="hidden space-y-2">
            <p class="text-xs text-muted-foreground">预约：未来 1 小时至 7 天内</p>
            <input type="datetime-local" class="w-full h-11 px-3 rounded-xl bg-input border-0 text-sm" />
          </div>
        </div>

        <div class="bg-card rounded-[16px] p-4 shadow-[0_1px_3px_rgba(0,0,0,0.04)]">
          <div class="flex items-center gap-2 mb-3">
            <i data-lucide="file-text" class="w-4 h-4 text-primary"></i>
            <span class="text-sm font-medium text-foreground">备注</span>
          </div>
          <textarea class="w-full h-[80px] bg-input rounded-[16px] px-4 py-3 text-sm border-none outline-none resize-none" placeholder="补充说明物品大小、特殊要求等..."></textarea>
        </div>
      </div>

      <div class="fixed bottom-0 left-0 right-0 bg-card shadow-[0_-2px_8px_rgba(0,0,0,0.04)] px-4 py-3 z-50 space-y-2">
        <button type="button" id="coupon-row" onclick="toggleCoupon()" class="w-full flex items-center justify-between text-sm border-0 bg-transparent cursor-pointer px-0 py-1">
          <span class="text-muted-foreground">优惠券</span>
          <span id="coupon-label" class="text-primary font-medium">未使用 ›</span>
        </button>
        <div class="flex items-center gap-3">
          <div class="flex-1">
            <span class="text-xs text-muted-foreground">预估托管</span>
            <span id="total-price" class="text-primary font-semibold text-lg ml-1">¥15.00</span>
          </div>
          <button type="button" id="submit-btn" class="cg-btn-primary rounded-[16px] px-8 border-0 cursor-pointer" onclick="submitPublish()">确认发布</button>
        </div>
      </div>
    </main>

    <div id="coupon-sheet" class="hidden fixed inset-0 z-[60]">
      <div class="absolute inset-0 bg-black/40" onclick="toggleCoupon(false)"></div>
      <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl p-5">
        <h3 class="text-base font-semibold mb-3">选择优惠券</h3>
        <button type="button" class="coupon-opt w-full text-left p-3 rounded-xl border border-primary bg-[#E6F5F2] mb-2 cursor-pointer" data-off="1" data-name="满5减1">满 5 减 1 · 有效期内</button>
        <button type="button" class="coupon-opt w-full text-left p-3 rounded-xl border border-border mb-2 cursor-pointer" data-off="0" data-name="">不使用优惠券</button>
        <button type="button" class="w-full h-11 rounded-2xl bg-primary text-white font-semibold border-0 cursor-pointer mt-2" onclick="toggleCoupon(false)">确定</button>
      </div>
    </div>

    <script>
      let mode = 'normal';
      let basePrice = 15;
      let couponOff = 0;
      let couponName = '';
      const hints = {
        normal: '标准跑腿：一人承担全部费用，发布后进入待接单。',
        group: '拼单：设置目标人数与分摊方式，满员后进入待接单。',
        emergency: '紧急：基础酬劳自动加价 50%，强推送给活跃跑腿员。',
        reserve: '预约：指定未来时间，跑腿员可提前占位。'
      };

      function payAmount() {
        let p = basePrice;
        if (mode === 'emergency') p = Math.round(p * 1.5 * 100) / 100;
        p = Math.max(0, Math.round((p - couponOff) * 100) / 100);
        return p;
      }

      function refreshPrice() {
        document.getElementById('total-price').textContent = '¥' + payAmount().toFixed(2);
        document.getElementById('emergency-price').classList.toggle('hidden', mode !== 'emergency');
        document.getElementById('pay-amount').textContent = '¥' + (Math.round(basePrice * 1.5 * 100) / 100).toFixed(2);
        document.getElementById('coupon-label').textContent = couponName ? (couponName + ' ›') : '未使用 ›';
      }

      function setMode(m) {
        mode = m;
        document.getElementById('mode-hint').textContent = hints[m];
        document.getElementById('group-fields').classList.toggle('hidden', m !== 'group');
        document.getElementById('time-normal').classList.toggle('hidden', m === 'reserve');
        document.getElementById('time-reserve').classList.toggle('hidden', m !== 'reserve');
        document.getElementById('time-label').textContent = m === 'reserve' ? '预约时间' : '期望时间';
        document.querySelectorAll('.mode-chip').forEach(btn => {
          const on = btn.dataset.mode === m;
          btn.className = 'mode-chip py-2.5 rounded-xl text-xs border-0 cursor-pointer ' + (on ? 'font-semibold bg-primary text-primary-foreground' : 'font-medium bg-[#F0F2F5] text-muted-foreground');
        });
        refreshPrice();
      }

      function submitPublish() {
        const q = mode === 'group' ? '?type=group' : (mode === 'emergency' ? '?type=emergency' : (mode === 'reserve' ? '?type=reserve' : ''));
        location.href = 't02-publish-success.html' + q;
      }

      function toggleCoupon(force) {
        const el = document.getElementById('coupon-sheet');
        const show = force === false ? false : el.classList.contains('hidden');
        el.classList.toggle('hidden', !show);
      }

      document.querySelectorAll('.mode-chip').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
      document.querySelectorAll('.cat-chip').forEach(b => b.addEventListener('click', () => {
        document.querySelectorAll('.cat-chip').forEach(c => {
          c.className = 'cat-chip flex items-center gap-1.5 shrink-0 px-4 py-2 rounded-full text-sm font-medium bg-card text-muted-foreground border border-border cursor-pointer';
        });
        b.className = 'cat-chip flex items-center gap-1.5 shrink-0 px-4 py-2 rounded-full text-sm font-medium bg-primary text-primary-foreground border-0 cursor-pointer';
        lucide.createIcons();
      }));
      document.querySelectorAll('.price-chip').forEach(b => b.addEventListener('click', () => {
        basePrice = Number(b.dataset.p);
        document.getElementById('price-input').value = basePrice.toFixed(2);
        refreshPrice();
      }));
      document.getElementById('price-input').addEventListener('input', e => {
        basePrice = Number(e.target.value) || 0;
        refreshPrice();
      });
      document.querySelectorAll('.split-chip').forEach(b => b.addEventListener('click', () => {
        document.querySelectorAll('.split-chip').forEach(c => {
          c.className = 'split-chip flex-1 h-10 rounded-xl text-sm font-medium bg-[#F0F2F5] text-muted-foreground border-0 cursor-pointer';
        });
        b.className = 'split-chip flex-1 h-10 rounded-xl text-sm font-medium bg-primary text-primary-foreground border-0 cursor-pointer';
      }));
      document.querySelectorAll('.coupon-opt').forEach(b => b.addEventListener('click', () => {
        couponOff = Number(b.dataset.off) || 0;
        couponName = b.dataset.name || '';
        document.querySelectorAll('.coupon-opt').forEach(c => {
          c.classList.remove('border-primary', 'bg-[#E6F5F2]');
          c.classList.add('border-border');
        });
        b.classList.add('border-primary', 'bg-[#E6F5F2]');
        b.classList.remove('border-border');
        refreshPrice();
      }));

      lucide.createIcons();
      setMode('normal');
    </script>
</body>
</html>
