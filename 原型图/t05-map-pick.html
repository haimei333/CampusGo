/* CampusGo Soft UI Design Token — Brand CSS */
/* Brand prefix: cg */

:root {
  /* ===== Brand Colors ===== */
  --cg-brand: #3D9B8F;
  --cg-brand-pressed: #34857B;
  --cg-brand-soft: #E6F5F2;

  /* ===== Accent ===== */
  --cg-accent: #E8A87C;
  --cg-accent-soft: #FFF1E6;

  /* ===== Semantic Colors ===== */
  --cg-danger: #E57373;
  --cg-danger-soft: #FDECEC;
  --cg-warning: #F0B429;
  --cg-success: #5BAE7A;
  --cg-emergency: #E8896B;

  /* ===== Neutral / Surface ===== */
  --cg-bg-app: #F3F5F8;
  --cg-bg-card: #FFFFFF;
  --cg-bg-input: #F0F2F5;
  --cg-text-primary: #2C3340;
  --cg-text-secondary: #6B7380;
  --cg-text-tertiary: #9AA3B2;
  --cg-text-on-brand: #FFFFFF;
  --cg-divider: #E8ECF1;
  --cg-overlay: rgba(44, 51, 64, 0.4);

  /* ===== Tag / Semantic Label Colors ===== */
  --cg-tag-normal-bg: #EEF1F5;
  --cg-tag-normal-text: #5A6575;
  --cg-tag-group-bg: #E6F5F2;
  --cg-tag-group-text: #2F7A70;
  --cg-tag-emergency-bg: #FFF0EA;
  --cg-tag-emergency-text: #C45C3E;
  --cg-tag-reserve-bg: #EAF0FB;
  --cg-tag-reserve-text: #4A6FA5;
  --cg-tag-draft-bg: #F5F5F5;
  --cg-tag-draft-text: #8A9099;

  /* ===== Radius ===== */
  --cg-radius-sm: 12px;
  --cg-radius-md: 16px;
  --cg-radius-lg: 24px;
  --cg-radius-full: 9999px;

  /* ===== Shadows (Soft) ===== */
  --cg-shadow-1: 0 1px 3px rgba(0, 0, 0, 0.04);
  --cg-shadow-2: 0 2px 8px rgba(0, 0, 0, 0.05);
  --cg-shadow-3: 0 4px 16px rgba(0, 0, 0, 0.06);
  --cg-shadow-fab: 0 4px 12px rgba(61, 155, 143, 0.25);

  /* ===== Semantic Aliases (required by apply-html-head-contract) ===== */
  --cg-background: #F3F5F8;
  --cg-foreground: #2C3340;
  --cg-card: #FFFFFF;
  --cg-card-foreground: #2C3340;
  --cg-popover: #FFFFFF;
  --cg-popover-foreground: #2C3340;
  --cg-primary: #3D9B8F;
  --cg-primary-foreground: #FFFFFF;
  --cg-muted: #F0F2F5;
  --cg-muted-foreground: #6B7380;
  --cg-border: #E8ECF1;
  --cg-input: #F0F2F5;
  --cg-ring: rgba(61, 155, 143, 0.45);

  /* ===== Typography ===== */
  --cg-font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --cg-font-hero: 28px;
  --cg-font-h1: 22px;
  --cg-font-h2: 18px;
  --cg-font-h3: 16px;
  --cg-font-body: 14px;
  --cg-font-caption: 12px;
  --cg-font-amount: 20px;

  --cg-font-weight-semibold: 600;
  --cg-font-weight-medium: 500;
  --cg-font-weight-regular: 400;

  --cg-line-height-tight: 1.25;
  --cg-line-height-normal: 1.5;
  --cg-line-height-relaxed: 1.75;
}

/* ===== Base Styles ===== */
body {
  font-family: var(--cg-font-family);
  font-size: var(--cg-font-body);
  font-weight: var(--cg-font-weight-regular);
  color: var(--cg-text-primary);
  background-color: var(--cg-bg-app);
  line-height: var(--cg-line-height-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ===== Typography Classes ===== */
.cg-hero {
  font-size: var(--cg-font-hero);
  font-weight: var(--cg-font-weight-semibold);
  line-height: var(--cg-line-height-tight);
}

.cg-h1 {
  font-size: var(--cg-font-h1);
  font-weight: var(--cg-font-weight-semibold);
  line-height: var(--cg-line-height-tight);
}

.cg-h2 {
  font-size: var(--cg-font-h2);
  font-weight: var(--cg-font-weight-semibold);
  line-height: var(--cg-line-height-tight);
}

.cg-h3 {
  font-size: var(--cg-font-h3);
  font-weight: var(--cg-font-weight-semibold);
  line-height: var(--cg-line-height-tight);
}

.cg-body {
  font-size: var(--cg-font-body);
  font-weight: var(--cg-font-weight-regular);
  line-height: var(--cg-line-height-normal);
}

.cg-caption {
  font-size: var(--cg-font-caption);
  font-weight: var(--cg-font-weight-regular);
  line-height: var(--cg-line-height-normal);
  color: var(--cg-text-secondary);
}

.cg-amount {
  font-size: var(--cg-font-amount);
  font-weight: var(--cg-font-weight-semibold);
  line-height: var(--cg-line-height-tight);
}

.cg-text-secondary {
  color: var(--cg-text-secondary);
}

.cg-text-tertiary {
  color: var(--cg-text-tertiary);
}

/* ===== Component Base Classes ===== */
.cg-btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 48px;
  padding: 0 24px;
  border-radius: var(--cg-radius-md);
  background: var(--cg-brand);
  color: var(--cg-text-on-brand);
  font-size: var(--cg-font-body);
  font-weight: var(--cg-font-weight-medium);
  border: none;
  cursor: pointer;
  transition: all 200ms ease;
  box-shadow: var(--cg-shadow-2);
}

.cg-btn-primary:active {
  transform: scale(0.97);
  background: var(--cg-brand-pressed);
}

.cg-btn-primary:disabled {
  background: #B7D9D3;
  box-shadow: none;
  transform: none;
}

.cg-btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 48px;
  padding: 0 24px;
  border-radius: var(--cg-radius-md);
  background: var(--cg-bg-card);
  color: var(--cg-brand);
  font-size: var(--cg-font-body);
  font-weight: var(--cg-font-weight-medium);
  border: none;
  cursor: pointer;
  transition: all 200ms ease;
  box-shadow: var(--cg-shadow-1);
}

.cg-btn-secondary:active {
  transform: scale(0.97);
}

.cg-btn-danger-text {
  background: none;
  border: none;
  color: var(--cg-danger);
  font-size: var(--cg-font-body);
  font-weight: var(--cg-font-weight-medium);
  cursor: pointer;
  padding: 12px 0;
}

.cg-card {
  background: var(--cg-bg-card);
  border-radius: var(--cg-radius-lg);
  padding: 16px;
  box-shadow: var(--cg-shadow-1);
}

.cg-input {
  height: 50px;
  padding: 0 20px;
  background: var(--cg-bg-input);
  border-radius: var(--cg-radius-md);
  border: none;
  font-size: var(--cg-font-body);
  font-family: var(--cg-font-family);
  color: var(--cg-text-primary);
  outline: none;
  transition: all 200ms ease;
  width: 100%;
  box-sizing: border-box;
}

.cg-input:focus {
  background: var(--cg-bg-card);
  box-shadow: 0 0 0 2px var(--cg-ring);
}

.cg-input::placeholder {
  color: var(--cg-text-tertiary);
}

.cg-tag {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: var(--cg-radius-sm);
  font-size: 11px;
  font-weight: var(--cg-font-weight-medium);
  line-height: 1.4;
}

.cg-tag-normal {
  background: var(--cg-tag-normal-bg);
  color: var(--cg-tag-normal-text);
}

.cg-tag-group {
  background: var(--cg-tag-group-bg);
  color: var(--cg-tag-group-text);
}

.cg-tag-emergency {
  background: var(--cg-tag-emergency-bg);
  color: var(--cg-tag-emergency-text);
}

.cg-tag-reserve {
  background: var(--cg-tag-reserve-bg);
  color: var(--cg-tag-reserve-text);
}

.cg-tag-draft {
  background: var(--cg-tag-draft-bg);
  color: var(--cg-tag-draft-text);
}

/* ===== Bottom Navigation ===== */
.cg-bottom-nav {
  background: var(--cg-bg-card);
  height: 56px;
  box-shadow: 0 -1px 4px rgba(0, 0, 0, 0.03);
  display: flex;
  align-items: center;
}

.cg-bottom-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  flex: 1;
  height: 100%;
  color: var(--cg-text-tertiary);
  font-size: 11px;
  font-weight: var(--cg-font-weight-regular);
  text-decoration: none;
  cursor: pointer;
  transition: color 200ms ease;
  min-width: 0;
}

.cg-bottom-nav-item svg {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
}

.cg-bottom-nav-item.active {
  color: var(--cg-brand);
}

.cg-bottom-nav-item.active .nav-icon-bg {
  background: var(--cg-brand-soft);
  border-radius: var(--cg-radius-md);
  padding: 4px;
}

/* ===== FAB ===== */
.cg-fab {
  position: fixed;
  bottom: 80px;
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: var(--cg-radius-full);
  background: var(--cg-brand);
  color: var(--cg-text-on-brand);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--cg-shadow-fab);
  border: none;
  cursor: pointer;
  transition: all 200ms ease;
  z-index: 50;
  font-size: 24px;
  font-weight: var(--cg-font-weight-regular);
}

.cg-fab:active {
  transform: scale(0.95);
}

/* ===== Top Bar ===== */
.cg-topbar {
  display: flex;
  align-items: center;
  height: 48px;
  padding: 0 16px;
  background: var(--cg-bg-card);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
  position: sticky;
  top: 0;
  z-index: 40;
}

.cg-topbar-title {
  font-size: var(--cg-font-h3);
  font-weight: var(--cg-font-weight-semibold);
  color: var(--cg-text-primary);
  flex: 1;
  text-align: center;
}

.cg-topbar-back {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--cg-text-primary);
  background: none;
  border: none;
  flex-shrink: 0;
}

.cg-topbar-action {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--cg-brand);
  font-size: var(--cg-font-body);
  font-weight: var(--cg-font-weight-medium);
  background: none;
  border: none;
  flex-shrink: 0;
}

/* ===== Status Banner ===== */
.cg-status-banner {
  padding: 10px 16px;
  border-radius: var(--cg-radius-md);
  font-size: var(--cg-font-caption);
  font-weight: var(--cg-font-weight-medium);
}

.cg-status-pending { background: #FFF8E7; color: #B8860B; }
.cg-status-accepted { background: var(--cg-brand-soft); color: var(--cg-brand); }
.cg-status-delivering { background: #E8F4FD; color: #2E7DB5; }
.cg-status-confirming { background: #FFF1E6; color: #C4763E; }
.cg-status-done { background: #E8F5EC; color: #3D7A52; }
.cg-status-cancelled { background: #F5F5F5; color: #8A9099; }

/* ===== Utility ===== */
.cg-divider {
  height: 1px;
  background: var(--cg-divider);
  border: none;
  margin: 0;
}

.cg-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

        <div class="flex items-center gap-2 mb-1">
          <i data-lucide="map-pin" class="w-4 h-4 flex-shrink-0" style="color: var(--cg-brand);"></i>
          <span class="text-[18px] font-semibold leading-tight" style="color: var(--cg-text-primary); font-family: var(--cg-font-family);" data-dom-id="address-text">北京大学 南门</span>
        </div>
        <p class="text-xs leading-relaxed mb-4" style="color: var(--cg-text-secondary); font-family: var(--cg-font-family);">海淀区颐和园路5号</p>

        <!-- Divider + Save address toggle -->
        <div class="flex items-center justify-between py-3 mb-5" style="border-top: 1px solid var(--cg-divider);">
          <span class="text-sm font-normal" style="color: var(--cg-text-primary); font-family: var(--cg-font-family);">存为常用地址</span>
          <label class="relative inline-flex items-center cursor-pointer" data-dom-id="save-address-checkbox">
            <input type="checkbox" class="sr-only peer">
            <div class="w-11 h-6 rounded-full transition-colors duration-200 peer-checked:bg-[var(--cg-brand)]" style="background: #D1D5DB;"></div>
            <div class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform duration-200 peer-checked:translate-x-5"></div>
          </label>
        </div>

        <!-- Confirm button -->
        <button class="w-full h-[48px] flex items-center justify-center border-none cursor-pointer text-base font-medium transition-all duration-200 active:scale-[0.97]" style="background: var(--cg-brand); color: var(--cg-text-on-brand); border-radius: var(--cg-radius-lg); box-shadow: var(--cg-shadow-2); font-family: var(--cg-font-family);" data-dom-id="btn-confirm">确认选点</button>
      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
